<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14131B">
<title>Pas à Pas – Apprendre TalkBack en s'amusant</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#14131B;
    --surface:#1E1D29;
    --surface-2:#262536;
    --text:#F5F1E6;
    --muted:#A9A6BB;
    --accent:#F2B705;
    --accent-2:#3ECF8E;
    --radius:20px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height:100dvh;
    line-height:1.5;
  }
  #app{ max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:24px 20px 40px; }
  .screen{ display:flex; flex-direction:column; gap:20px; flex:1; }

  .eyebrow{ color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-size:.8rem; font-weight:700; margin:0; }
  h1{ font-size:clamp(2.2rem,9vw,2.8rem); margin:0 0 4px; font-weight:800; letter-spacing:-0.01em; }
  h2{ font-size:1.1rem; margin:0; }

  .trail{ display:flex; gap:6px; font-size:1.6rem; align-items:flex-end; }
  .trail .footprint{ filter:grayscale(1) opacity(.35); display:inline-block; }
  .trail .footprint:nth-child(even){ transform:translateY(6px); }
  .trail .footprint.done{ filter:none; text-shadow:0 0 12px rgba(242,183,5,.5); }

  .home-sub{ color:var(--muted); font-size:1rem; margin:0; }

  .btn-primary{
    background:var(--accent); color:#1A1400; border:none; border-radius:999px;
    padding:16px 24px; font-size:1.15rem; font-weight:700; cursor:pointer;
  }
  .btn-primary:focus-visible{ outline:3px solid var(--accent-2); outline-offset:3px; }

  .btn-quiet{
    background:transparent; color:var(--muted); border:1px solid var(--surface-2);
    border-radius:999px; padding:10px 16px; font-size:.95rem; cursor:pointer;
  }
  .btn-quiet:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

  .btn-link{ background:none; border:none; color:var(--muted); text-decoration:underline; font-size:.9rem; padding:8px 0; cursor:pointer; align-self:flex-start; }

  .menu-heading{ margin-top:8px; color:var(--muted); font-weight:700; font-size:.95rem; text-transform:uppercase; letter-spacing:.08em; }

  .level-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .level-item{
    width:100%; display:flex; align-items:center; gap:14px; background:var(--surface);
    border:2px solid transparent; border-radius:16px; padding:14px 16px; color:var(--text);
    text-align:left; cursor:pointer; font-size:1rem;
  }
  .level-item:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .level-item-emoji{ font-size:1.6rem; }
  .level-item-text{ display:flex; flex-direction:column; }
  .level-item-title{ font-weight:700; }
  .level-item-desc{ color:var(--muted); font-size:.88rem; }

  .howto{ background:var(--surface); border-radius:14px; padding:12px 16px; color:var(--muted); }
  .howto summary{ color:var(--text); font-weight:700; cursor:pointer; }
  .howto p{ margin:10px 0 0; font-size:.92rem; }

  .level-topbar{ display:flex; justify-content:space-between; align-items:center; }
  .level-tag{ color:var(--muted); font-weight:700; }

  .stage{ background:var(--surface); border-radius:var(--radius); padding:24px; min-height:96px; display:flex; align-items:center; }
  .stage-text{ margin:0; font-size:clamp(1.3rem,5.5vw,1.7rem); font-weight:700; }

  .cards-zone{ display:flex; gap:12px; flex-wrap:wrap; }
  .cards-zone.cards-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }

  .card{
    flex:1 1 0; min-width:120px; min-height:110px; background:var(--surface-2);
    border:2px solid transparent; border-radius:16px; color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:14px 8px; font-size:1rem; cursor:pointer;
  }
  .card:focus-visible{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(242,183,5,.25); }
  .card-emoji{ font-size:2rem; }
  .card-label{ text-align:center; }

  .complete-screen{ align-items:center; text-align:center; justify-content:center; gap:16px; }
  .complete-emoji{ font-size:3.4rem; margin:0; }
  .complete-sub{ color:var(--muted); margin:0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  'use strict';

  /* =========================================================
     STOCKAGE DE LA PROGRESSION
     ========================================================= */
  var STORAGE_KEY = 'pasapas_progress_v1';

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { completed: [] };
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.completed)) return { completed: [] };
      return parsed;
    }catch(e){ return { completed: [] }; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress();

  /* =========================================================
     COACH VOCAL (speechSynthesis)
     On annule uniquement NOTRE PROPRE file d'attente avant de parler
     (jamais celle de TalkBack, qu'on ne contrôle pas et qu'on laisse
     s'exprimer librement quand il annonce les cases au focus).
     ========================================================= */
  var frenchVoice = null;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var voices = speechSynthesis.getVoices();
    frenchVoice = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf('fr') === 0; }) || null;
  }
  if('speechSynthesis' in window){
    pickVoice();
    speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }
  function speak(text, onend){
    if(!('speechSynthesis' in window)){ if(onend) onend(); return; }
    speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR';
    if(frenchVoice) utter.voice = frenchVoice;
    utter.rate = 1;
    if(onend) utter.addEventListener('end', onend, { once:true });
    speechSynthesis.speak(utter);
  }
  function stopSpeaking(){
    if('speechSynthesis' in window) speechSynthesis.cancel();
  }

  /* =========================================================
     SONS (WebAudio, aucun fichier externe)
     ========================================================= */
  var audioCtx = null;
  function ctx(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    return audioCtx;
  }
  function tone(freq, start, duration, gain){
    try{
      var c = ctx();
      var osc = c.createOscillator();
      var g = c.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.value = 0;
      osc.connect(g); g.connect(c.destination);
      var t0 = c.currentTime + start;
      g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
      g.gain.linearRampToValueAtTime(0, t0 + duration);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    }catch(e){ /* audio indisponible, on ignore silencieusement */ }
  }
  function chimeSuccess(){ tone(660,0,0.14,0.18); tone(880,0.1,0.18,0.18); }
  function chimeBigSuccess(){ tone(523,0,0.12,0.18); tone(659,0.1,0.12,0.18); tone(784,0.2,0.22,0.2); }
  function chimeSoft(){ tone(392,0,0.12,0.12); }

  function stopAll(){ stopSpeaking(); }

  /* =========================================================
     NIVEAUX
     ========================================================= */
  var SUCCESS_FORWARD = ["Voilà, un pas de plus !", "Bien joué, tu avances !", "Génial, continue comme ça !"];
  var SUCCESS_BACKWARD = ["Parfait, tu recules bien !", "Bien vu, tu reviens en arrière !", "Continue, tu maîtrises le geste !"];

  function renderCardRow(container, items, extraClass){
    container.innerHTML = '';
    container.className = 'cards-zone' + (extraClass ? ' ' + extraClass : '');
    return items.map(function(item, idx){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card';
      btn.dataset.index = String(idx);
      btn.innerHTML = '<span class="card-emoji" aria-hidden="true">' + item.emoji + '</span>' +
                       '<span class="card-label">' + item.label + '</span>';
      container.appendChild(btn);
      return btn;
    });
  }

  function buildForwardLevel(container, api){
    var items = [
      { emoji:'🪨', label:'le caillou' },
      { emoji:'🍂', label:'la feuille' },
      { emoji:'🐚', label:'le coquillage' },
      { emoji:'🌟', label:'l’étoile' }
    ];
    var cards = renderCardRow(container, items);
    var maxReached = 0;
    cards.forEach(function(card, idx){
      card.addEventListener('focus', function(){
        if(idx > maxReached){
          maxReached = idx;
          if(idx === cards.length - 1){
            api.complete("Bravo, tu as parcouru tout le chemin en avançant ! Tu maîtrises le balayage vers la droite.");
          }else{
            var msg = SUCCESS_FORWARD[idx % SUCCESS_FORWARD.length];
            api.setStageText(msg); speak(msg); chimeSuccess();
          }
        }else if(idx < maxReached){
          var hint = "Pas de souci, essaie de balayer vers la droite pour continuer d'avancer.";
          api.setStageText(hint);
        }
      });
    });
    cards[0].focus();
  }

  function buildBackwardLevel(container, api){
    var items = [
      { emoji:'🌟', label:'l’étoile' },
      { emoji:'🐚', label:'le coquillage' },
      { emoji:'🍂', label:'la feuille' },
      { emoji:'🪨', label:'le caillou' }
    ];
    var cards = renderCardRow(container, items);
    var minReached = cards.length - 1;
    cards.forEach(function(card, idx){
      card.addEventListener('focus', function(){
        if(idx < minReached){
          minReached = idx;
          if(idx === 0){
            api.complete("Bravo, tu es revenu jusqu'au début du chemin ! Tu maîtrises le balayage vers la gauche.");
          }else{
            var msg = SUCCESS_BACKWARD[idx % SUCCESS_BACKWARD.length];
            api.setStageText(msg); speak(msg); chimeSuccess();
          }
        }else if(idx > minReached){
          var hint = "Pas de souci, essaie de balayer vers la gauche pour continuer de reculer.";
          api.setStageText(hint);
        }
      });
    });
    cards[0].focus();
  }

  function buildExploreLevel(container, api){
    var items = [
      { emoji:'🍄', label:'le champignon' },
      { emoji:'🦋', label:'le papillon' },
      { emoji:'🌼', label:'la marguerite' },
      { emoji:'🐌', label:'l’escargot' },
      { emoji:'🍯', label:'le pot de miel' },
      { emoji:'🪵', label:'la bûche' }
    ];
    var cards = renderCardRow(container, items, 'cards-grid');
    var visited = new Set();
    cards.forEach(function(card, idx){
      card.addEventListener('focus', function(){
        if(visited.has(idx)) return;
        visited.add(idx);
        chimeSoft();
        if(visited.size === cards.length){
          api.complete("Superbe, tu as exploré toutes les cases du plateau du bout du doigt !");
        }else if(visited.size === cards.length - 1){
          var msg = "Encore une case à découvrir !";
          api.setStageText(msg); speak(msg);
        }
      });
    });
    cards[0].focus();
  }

  function buildActivateLevel(container, api){
    var items = [
      { emoji:'🧦', label:'la chaussette', target:false },
      { emoji:'💰', label:'le trésor', target:true },
      { emoji:'🧹', label:'le balai', target:false },
      { emoji:'🪑', label:'la chaise', target:false }
    ];
    var cards = renderCardRow(container, items);
    var targetIdx = items.findIndex(function(i){ return i.target; });
    cards.forEach(function(card, idx){
      card.addEventListener('click', function(){
        if(idx === targetIdx){
          api.complete("Parfait double-tap, tu as activé le trésor !");
        }else{
          chimeSoft();
          var msg = "Beau double-tap ! Ce n'est pas la bonne case, cherche encore le trésor.";
          api.setStageText(msg); speak(msg);
        }
      });
    });
    cards[0].focus();
  }

  function buildBonusLevel(container, api){
    var items = [
      { emoji:'🪨', label:'un caillou', target:false },
      { emoji:'🍂', label:'une feuille', target:false },
      { emoji:'🏆', label:'le trophée', target:true },
      { emoji:'🐚', label:'un coquillage', target:false },
      { emoji:'🌟', label:'une étoile', target:false },
      { emoji:'🧦', label:'une chaussette', target:false }
    ];
    var cards = renderCardRow(container, items, 'cards-grid');
    var targetIdx = items.findIndex(function(i){ return i.target; });
    var visited = new Set();
    cards.forEach(function(card, idx){
      card.addEventListener('focus', function(){
        if(!visited.has(idx)){ visited.add(idx); chimeSoft(); }
      });
      card.addEventListener('click', function(){
        if(idx === targetIdx){
          api.complete("Trophée récupéré ! Tu maîtrises maintenant les gestes essentiels de TalkBack. Bravo pour tout ce chemin parcouru.");
        }else{
          var msg = "Ce n'est pas encore le trophée, continue d'explorer le plateau.";
          api.setStageText(msg); speak(msg);
        }
      });
    });
    cards[0].focus();
  }

  var LEVELS = [
    {
      id:'forward', emoji:'➡️', title:'Avancer', menuLabel:'Balayer pour avancer',
      intro:"Premier jeu : avancer. Pose un doigt sur l'écran et balaie-le vers la droite pour passer à la case suivante. Suis le petit chemin jusqu'au bout.",
      build: buildForwardLevel
    },
    {
      id:'backward', emoji:'⬅️', title:'Reculer', menuLabel:'Balayer pour reculer',
      intro:"Deuxième jeu : reculer. Balaie ton doigt vers la gauche pour revenir en arrière, case après case, jusqu'au début du chemin.",
      build: buildBackwardLevel
    },
    {
      id:'explore', emoji:'✋', title:'Explorer', menuLabel:'Explorer du bout du doigt',
      intro:"Troisième jeu : explorer. Pose ton doigt sur l'écran et fais-le glisser doucement, sans le lever, pour découvrir toutes les cases du plateau, dans n'importe quel ordre.",
      build: buildExploreLevel
    },
    {
      id:'activate', emoji:'👆', title:'Activer', menuLabel:'Double-taper pour activer',
      intro:"Quatrième jeu : activer. Trouve la case du trésor parmi les autres, puis double-tape n'importe où sur l'écran pour l'activer, une fois qu'elle est sélectionnée.",
      build: buildActivateLevel
    },
    {
      id:'bonus', emoji:'🏆', title:'La chasse au trésor', menuLabel:'Le grand jeu final',
      intro:"Dernier défi : explore le plateau pour trouver le trophée caché, puis double-tape pour le récupérer. Tu as tous les gestes en main, à toi de jouer !",
      build: buildBonusLevel
    }
  ];

  /* =========================================================
     ECRANS
     ========================================================= */
  function renderHome(){
    stopAll();
    var app = document.getElementById('app');
    var doneCount = progress.completed.length;
    var nextIndex = LEVELS.findIndex(function(l){ return progress.completed.indexOf(l.id) === -1; });
    var allDone = nextIndex === -1;
    var ctaLabel = doneCount === 0 ? 'Commencer l’aventure' : (allDone ? 'Recommencer le parcours' : 'Continuer l’aventure');

    var footprints = LEVELS.map(function(l){
      var done = progress.completed.indexOf(l.id) !== -1;
      return '<span class="footprint' + (done ? ' done' : '') + '">👣</span>';
    }).join('');

    var levelItems = LEVELS.map(function(l, i){
      var done = progress.completed.indexOf(l.id) !== -1;
      return '<li><button class="level-item" data-index="' + i + '">' +
        '<span class="level-item-emoji" aria-hidden="true">' + (done ? '👣' : l.emoji) + '</span>' +
        '<span class="level-item-text">' +
          '<span class="level-item-title">' + l.title + (done ? ' — terminé' : '') + '</span>' +
          '<span class="level-item-desc">' + l.menuLabel + '</span>' +
        '</span>' +
      '</button></li>';
    }).join('');

    app.innerHTML =
      '<div class="screen home-screen">' +
        '<p class="eyebrow">Un jeu vocal pour apprivoiser TalkBack</p>' +
        '<h1>Pas à Pas</h1>' +
        '<div class="trail" aria-hidden="true">' + footprints + '</div>' +
        '<p class="home-sub">Cinq petits jeux, un geste à la fois. Active TalkBack, pose ton doigt sur l\'écran, et laisse-toi guider par la voix.</p>' +
        '<button class="btn-primary" id="btn-cta">' + ctaLabel + '</button>' +
        '<details class="howto">' +
          '<summary>Comment ça marche ?</summary>' +
          '<p>Active d\'abord TalkBack sur ton téléphone si ce n\'est pas déjà fait. L\'appli te guide ensuite à la voix pour reconnaître quatre gestes essentiels : balayer pour avancer, balayer pour reculer, explorer du bout du doigt, et double-taper pour activer. Prends ton temps, il n\'y a pas de mauvaise réponse, seulement des essais.</p>' +
        '</details>' +
        '<h2 class="menu-heading">Les jeux</h2>' +
        '<ul class="level-list">' + levelItems + '</ul>' +
        '<button class="btn-link" id="btn-reset">Remettre ma progression à zéro</button>' +
      '</div>';

    document.getElementById('btn-cta').addEventListener('click', function(){
      renderLevel(allDone ? 0 : nextIndex);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.level-item'), function(btn){
      btn.addEventListener('click', function(){ renderLevel(Number(btn.dataset.index)); });
    });
    document.getElementById('btn-reset').addEventListener('click', function(){
      if(window.confirm('Remettre toute la progression à zéro ?')){
        progress = { completed: [] };
        saveProgress(progress);
        renderHome();
      }
    });
  }

  function renderLevel(index){
    stopAll();
    var level = LEVELS[index];
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="screen level-screen">' +
        '<div class="level-topbar">' +
          '<button class="btn-quiet" id="btn-menu">Retour au menu</button>' +
          '<span class="level-tag">' + level.emoji + ' ' + level.title + '</span>' +
        '</div>' +
        '<div class="stage" aria-hidden="true"><p class="stage-text" id="stage-text">' + level.intro + '</p></div>' +
        '<div class="cards-zone" id="cards-zone"></div>' +
      '</div>';

    document.getElementById('btn-menu').addEventListener('click', function(){ renderHome(); });
    var stageText = document.getElementById('stage-text');
    var cardsZone = document.getElementById('cards-zone');

    function setStageText(t){ stageText.textContent = t; }

    function complete(finalMessage){
      if(progress.completed.indexOf(level.id) === -1){
        progress.completed.push(level.id);
        saveProgress(progress);
      }
      chimeBigSuccess();
      setStageText(finalMessage);
      speak(finalMessage, function(){ renderLevelComplete(index); });
    }

    speak(level.intro, function(){
      level.build(cardsZone, { setStageText: setStageText, complete: complete });
    });
  }

  function renderLevelComplete(index){
    var level = LEVELS[index];
    var isLast = index === LEVELS.length - 1;
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="screen complete-screen">' +
        '<p class="complete-emoji" aria-hidden="true">' + level.emoji + '</p>' +
        '<h2>Niveau terminé : ' + level.title + ' !</h2>' +
        '<p class="complete-sub">Un nouveau pas gravé dans le chemin.</p>' +
        '<button class="btn-primary" id="btn-next">' + (isLast ? 'Retourner au menu' : 'Niveau suivant') + '</button>' +
        '<button class="btn-quiet" id="btn-menu2">Retour au menu</button>' +
      '</div>';
    document.getElementById('btn-next').addEventListener('click', function(){
      if(isLast){ renderHome(); } else { renderLevel(index + 1); }
    });
    document.getElementById('btn-menu2').addEventListener('click', renderHome);
    document.getElementById('btn-next').focus();
  }

  /* =========================================================
     INITIALISATION
     ========================================================= */
  document.addEventListener('DOMContentLoaded', renderHome);

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
