<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14131B">
<title>Pas à Pas – Apprendre TalkBack en s'amusant</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#14131B;
    --surface:#1E1D29;
    --surface-2:#262536;
    --text:#F5F1E6;
    --muted:#A9A6BB;
    --accent:#F2B705;
    --accent-2:#3ECF8E;
    --radius:20px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height:100dvh;
    line-height:1.5;
  }
  #app{ max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:24px 20px 40px; }
  .screen{ display:flex; flex-direction:column; gap:20px; flex:1; }

  h1{ font-size:clamp(2.2rem,9vw,2.8rem); margin:0 0 4px; font-weight:800; letter-spacing:-0.01em; }
  h2{ font-size:1.1rem; margin:0; }

  .home-sub{ color:var(--muted); font-size:1rem; margin:0; }

  .btn-primary{
    background:var(--accent); color:#1A1400; border:none; border-radius:999px;
    padding:16px 24px; font-size:1.15rem; font-weight:700; cursor:pointer;
  }
  .btn-primary:focus-visible{ outline:3px solid var(--accent-2); outline-offset:3px; }

  .btn-quiet{
    background:transparent; color:var(--muted); border:1px solid var(--surface-2);
    border-radius:999px; padding:10px 16px; font-size:.95rem; cursor:pointer;
  }
  .btn-quiet:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

  .menu-heading{ margin-top:8px; color:var(--muted); font-weight:700; font-size:.95rem; text-transform:uppercase; letter-spacing:.08em; }

  .level-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .level-item{
    width:100%; background:var(--surface);
    border:2px solid transparent; border-radius:16px; padding:14px 16px; color:var(--text);
    text-align:left; cursor:pointer; font-size:1.05rem; font-weight:700;
  }
  button.level-item:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

  .bottom-bar{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:16px; }
  .bottom-bar-home{ justify-content:flex-end; }
  .level-score{ color:var(--accent); font-weight:800; margin:0; font-size:1.05rem; }

  .cards-zone{ display:flex; gap:12px; flex-wrap:wrap; }
  .cards-zone.cards-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }

  .card{
    flex:1 1 0; min-width:120px; min-height:110px; background:var(--surface-2);
    border:2px solid transparent; border-radius:16px; color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:14px 8px; font-size:1rem; cursor:pointer;
  }
  .card:focus-visible{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(242,183,5,.25); }
  .card-number{ font-weight:700; font-size:1.15rem; }

  .image-grid{ grid-template-columns:repeat(2,1fr); }
  .card-image{
    width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:16px;
    border:2px solid transparent; cursor:pointer; display:block;
  }
  .card-image:focus-visible{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(242,183,5,.25); }
  .start-round-btn{ align-self:center; }

  .complete-screen{ align-items:center; text-align:center; justify-content:center; gap:16px; }
  .complete-emoji{ font-size:3.4rem; margin:0; }
  .complete-sub{ color:var(--muted); margin:0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  'use strict';

  /* =========================================================
     STOCKAGE DE LA PROGRESSION
     progress.completed : identifiants des jeux réussis à 6/6
     progress.scores    : meilleur score obtenu par jeu (0 à 6)
     ========================================================= */
  var STORAGE_KEY = 'pasapas_progress_v4';

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { completed: [], scores: {} };
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.completed)) return { completed: [], scores: {} };
      if(!parsed.scores || typeof parsed.scores !== 'object') parsed.scores = {};
      return parsed;
    }catch(e){ return { completed: [], scores: {} }; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress();

  function recordScore(id, score){
    var prevBest = progress.scores[id] || 0;
    progress.scores[id] = Math.max(prevBest, score);
    if(score === 6 && progress.completed.indexOf(id) === -1){
      progress.completed.push(id);
    }
    saveProgress(progress);
  }

  /* =========================================================
     COACH VOCAL (speechSynthesis)
     On annule uniquement NOTRE PROPRE file d'attente avant de parler
     (jamais celle de TalkBack, qu'on ne contrôle pas et qu'on laisse
     s'exprimer librement quand il annonce les cases au focus).
     ========================================================= */
  var frenchVoice = null;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var voices = speechSynthesis.getVoices();
    frenchVoice = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf('fr') === 0; }) || null;
  }
  if('speechSynthesis' in window){
    pickVoice();
    speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }
  function speak(text, onend){
    if(!('speechSynthesis' in window)){ if(onend) onend(); return; }
    speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR';
    if(frenchVoice) utter.voice = frenchVoice;
    utter.rate = 1;
    if(onend){
      var done = false;
      var finish = function(){
        if(done) return;
        done = true;
        onend();
      };
      utter.addEventListener('end', finish, { once:true });
      utter.addEventListener('error', finish, { once:true });
      // Filet de sécurité : sur certains téléphones Android, l'événement
      // "end" de speechSynthesis ne se déclenche pas toujours de façon
      // fiable (bug connu, notamment avec TalkBack actif en parallèle).
      // Sans ce filet, l'appli restait bloquée sur l'écran du jeu.
      var estimatedMs = Math.max(3000, Math.min(12000, text.split(/\s+/).length * 420 + 1200));
      setTimeout(finish, estimatedMs);
    }
    speechSynthesis.speak(utter);
  }
  function stopSpeaking(){
    if('speechSynthesis' in window) speechSynthesis.cancel();
  }
  // Un focus ou un clic déclenche presque toujours une annonce TalkBack
  // (nom de la case, "bouton", "double-tapez pour activer"...). Si on
  // parle nous-mêmes au même instant, notre message est souvent couvert
  // ou coupé. On laisse donc un court délai à TalkBack pour terminer sa
  // propre annonce avant de déclencher la nôtre.
  var ANNOUNCE_DELAY_MS = 700;
  function announce(text, onend, delayMs){
    setTimeout(function(){ speak(text, onend); }, typeof delayMs === 'number' ? delayMs : ANNOUNCE_DELAY_MS);
  }

  /* =========================================================
     SONS (WebAudio, aucun fichier externe)
     ========================================================= */
  var audioCtx = null;
  function ctx(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    return audioCtx;
  }
  function tone(freq, start, duration, gain){
    try{
      var c = ctx();
      var osc = c.createOscillator();
      var g = c.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.value = 0;
      osc.connect(g); g.connect(c.destination);
      var t0 = c.currentTime + start;
      g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
      g.gain.linearRampToValueAtTime(0, t0 + duration);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    }catch(e){ /* audio indisponible, on ignore silencieusement */ }
  }
  function chimeSuccess(){ tone(660,0,0.14,0.18); tone(880,0.1,0.18,0.18); }
  function chimeBigSuccess(){ tone(523,0,0.12,0.18); tone(659,0.1,0.12,0.18); tone(784,0.2,0.22,0.2); }
  function chimeSoft(){ tone(392,0,0.12,0.12); }

  function stopAll(){ stopSpeaking(); }

  function shuffleIndices(n){
    var arr = [];
    for(var i = 0; i < n; i++) arr.push(i);
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* =========================================================
     JEU 1 : "Découvrir TalkBack" — jeu d'initiation, sans points.
     Retrouver les chiffres de 1 à 4 dans l'ordre, en 30 secondes,
     pour se familiariser avec le focus et l'exploration tactile
     avant les jeux suivants (qui, eux, comptent des points).

     Pourquoi l'exploration tactile plutôt que le balayage haut/bas :
     un balayage (flick) vers le haut ou le bas n'est PAS traduit par
     TalkBack en déplacement du focus (par défaut il change la
     granularité de lecture). L'exploration tactile (glisser le doigt
     SANS le lever) suit elle la position physique du doigt dans
     toutes les directions et déclenche un événement "focus" sur
     l'élément survolé — c'est ce mécanisme qu'on utilise ici.
     ========================================================= */
  var INTRO_NUMBER_WORDS = { 1:'Un', 2:'Deux', 3:'Trois', 4:'Quatre' };
  var INTRO_SUCCESS_MSGS = [
    "Voilà, un pas de plus !",
    "Bien joué, tu avances !",
    "Parfait, continue comme ça !"
  ];
  var INTRO_TIME_LIMIT = 30;

  function buildIntroGestureLevel(container, api){
    api.setScore(0); // jeu d'initiation : jamais de points

    var order = shuffleIndices(4);
    container.innerHTML = '';
    container.className = 'cards-zone cards-grid';
    var cards = order.map(function(idx){
      var n = idx + 1;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card card-number';
      btn.dataset.value = String(n);
      btn.textContent = n + ' (' + INTRO_NUMBER_WORDS[n] + ')';
      container.appendChild(btn);
      return btn;
    });

    var expected = 1;
    var timeLeft = INTRO_TIME_LIMIT;
    var finished = false;

    var timerId = setInterval(function(){
      timeLeft--;
      if(timeLeft <= 0){
        clearInterval(timerId); timerId = null;
        if(!finished){
          finished = true;
          api.finishIntro("Le temps est écoulé, mais tu t'es bien entraîné. N'hésite pas à recommencer pour t'améliorer.", false);
        }
      }
    }, 1000);

    cards.forEach(function(card){
      card.addEventListener('focus', function(){
        if(finished) return;
        var val = Number(card.dataset.value);
        if(val !== expected) return; // chiffre hors-ordre : on ignore, pas de pénalité
        card.textContent = card.textContent + ' — trouvé !';
        if(expected < 4){
          chimeSuccess();
          var msg = INTRO_SUCCESS_MSGS[(expected - 1) % INTRO_SUCCESS_MSGS.length];
          api.setStageText(msg); announce(msg);
          expected++;
        }else{
          finished = true;
          if(timerId){ clearInterval(timerId); timerId = null; }
          api.finishIntro("Bravo, tu as retrouvé les quatre chiffres dans l'ordre ! Tu commences à comprendre comment TalkBack te guide.", true);
        }
      });
    });
    cards[0].focus();

    api.registerCleanup(function(){
      if(timerId){ clearInterval(timerId); timerId = null; }
    });
  }

  /* =========================================================
     JEU 2 : "Explorer et activer" — six inventions à ouvrir dans
     leur ordre chronologique. Explorer (focus) fait juste découvrir
     le nom ; double-taper (clic) révèle la période ET compte pour
     la chronologie. Une invention ouverte hors-ordre révèle quand
     même sa date (toujours instructif) mais coûte un point, une
     seule fois par invention.
     ========================================================= */
  var INVENTIONS = [
    { name:'L’imprimerie', period:'vers 1450' },
    { name:'La locomotive à vapeur', period:'vers 1803' },
    { name:'Le téléphone', period:'vers 1876' },
    { name:'L’ampoule électrique', period:'vers 1878' },
    { name:'La radio', period:'vers 1897' },
    { name:'La télévision', period:'vers 1950' }
  ]; // déjà dans l'ordre chronologique ; rang = index + 1

  function buildInventionsLevel(container, api){
    var expectedRank = 1;
    var score = 6;
    var opened = {};

    api.setScore(score);

    var order = shuffleIndices(6);
    container.innerHTML = '';
    container.className = 'cards-zone cards-grid';
    var cards = order.map(function(idx){
      var inv = INVENTIONS[idx];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card';
      btn.dataset.rank = String(idx + 1);
      btn.textContent = inv.name;
      container.appendChild(btn);
      return btn;
    });

    cards.forEach(function(card){
      card.addEventListener('click', function(){
        var rank = Number(card.dataset.rank);
        var inv = INVENTIONS[rank - 1];
        var alreadyOpened = !!opened[rank];

        if(!alreadyOpened){
          card.textContent = inv.name + ' — ' + inv.period;
          opened[rank] = true;
        }

        if(rank === expectedRank){
          var msg = inv.name + ' ' + inv.period + ', c’est la bonne suite chronologique.';
          api.setStageText(msg); announce(msg); chimeSuccess();
          expectedRank++;
          if(expectedRank > 6){
            api.setScore(score);
            var finalMsg = 'Bravo, tu as trouvé la bonne chronologie. Tu marques ' + score + (score > 1 ? ' points.' : ' point.');
            api.complete(finalMsg, score);
          }
        }else if(!alreadyOpened){
          score = Math.max(0, score - 1);
          api.setScore(score);
          var msg2 = inv.name + ' ' + inv.period + '. Pas encore son tour, continue de chercher.';
          api.setStageText(msg2); announce(msg2); chimeSoft();
        }else{
          var msg3 = inv.name + ' ' + inv.period + '.';
          api.setStageText(msg3); announce(msg3);
        }
      });
    });
    cards[0].focus();
  }

  /* =========================================================
     JEU 3 : "Découvrir le menu, décrire l'image" — les 6 images
     sont volontairement SANS texte alternatif (pas de "alt", pas de
     libellé accessible) : c'est ce qui permet à TalkBack de les
     considérer comme "images non étiquetées" et de proposer la
     commande "Décrire l'image" dans son menu. Le nom de chaque
     image n'est donc jamais donné par l'appli elle-même — seule
     l'exploration + "Décrire l'image" permet de savoir laquelle
     est laquelle, ce qui rend cette compétence réellement utile
     pour le défi chronométré, et pas juste un bonus.
     Point d'incertitude technique : ce comportement est documenté
     pour Android en général, pas spécifiquement pour une image
     dans une page web — à valider sur le terrain.
     ========================================================= */
  var FIND_IMAGES = [
    { id:'beaute', name:'La beauté', file:'images/la-beaute.jpg' },
    { id:'maison', name:'La maison', file:'images/la-maison.jpg' },
    { id:'avh', name:'Le comité AVH', file:'images/le-comite-avh.jpg' },
    { id:'voyage', name:'Le voyage', file:'images/le-voyage.jpg' },
    { id:'ferme', name:'Les animaux de la ferme', file:'images/les-animaux-de-la-ferme.jpg' },
    { id:'la-voiture', name:'La voiture', file:'images/la-voiture.jpg' }
  ];
  var FIND_TIME_LIMIT = 30;

  function buildImageFindLevel(container, api){
    api.setScore(0);

    var order = shuffleIndices(6);
    container.innerHTML = '';
    container.className = 'cards-zone cards-grid image-grid';
    var cards = order.map(function(idx){
      var img = FIND_IMAGES[idx];
      var el = document.createElement('img');
      el.className = 'card card-image';
      el.src = img.file;
      el.tabIndex = 0; // focusable au clavier/TalkBack, sans "alt" : image non étiquetée
      el.dataset.id = img.id;
      container.appendChild(el);
      return el;
    });

    var startBtn = document.createElement('button');
    startBtn.type = 'button';
    startBtn.className = 'btn-primary start-round-btn';
    startBtn.textContent = 'Lancer le défi chronométré';
    container.parentNode.insertBefore(startBtn, container.nextSibling);

    var timerId = null;
    var roundActive = false;

    function clickHandler(){
      if(!roundActive) return;
      var target = clickHandler.target;
      if(this.dataset.id === target.id){
        roundActive = false;
        if(timerId){ clearInterval(timerId); timerId = null; }
        api.setScore(6);
        api.complete('Bravo, tu as trouvé ' + target.name + ' à temps. Tu marques 6 points.', 6);
      }
      // mauvaise image : on ignore, le chrono continue
    }

    function startRound(){
      startBtn.disabled = true;
      startBtn.textContent = 'Défi en cours...';
      var target = FIND_IMAGES[Math.floor(Math.random() * FIND_IMAGES.length)];
      clickHandler.target = target;
      var timeLeft = FIND_TIME_LIMIT;
      roundActive = true;

      cards.forEach(function(card){ card.addEventListener('click', clickHandler); });

      var msg = 'Retrouve l’image : ' + target.name + '. Tu as trente secondes, double-tape dessus quand tu l’as trouvée.';
      announce(msg);

      timerId = setInterval(function(){
        timeLeft--;
        if(timeLeft <= 0){
          clearInterval(timerId); timerId = null;
          if(roundActive){
            roundActive = false;
            api.fail('Le temps est écoulé. Ce sera pour une prochaine fois.', 0);
          }
        }
      }, 1000);
    }

    startBtn.addEventListener('click', startRound);

    api.registerCleanup(function(){
      if(timerId){ clearInterval(timerId); timerId = null; }
      roundActive = false;
    });
  }

  var LEVELS = [
    {
      id: 'intro-gesture',
      title: 'Découvrir TalkBack',
      scoreless: true,
      intro: "Pose un doigt sur l'écran et déplace-le pour obtenir la suite des chiffres 1, 2, 3, 4 en continu. Tu as trente secondes pour ce premier jeu.",
      build: buildIntroGestureLevel
    },
    {
      id: 'explore-inventions',
      title: 'Explorer et activer',
      intro: "Découvre les six inventions. Choisis la plus ancienne et double-tape pour en connaître la période. Remonte le temps jusqu'à l'invention la plus récente. À chaque erreur, tu perds un point.",
      build: buildInventionsLevel
    },
    {
      id: 'find-image',
      title: 'Découvrir le menu, décrire l’image',
      intro: "Six images te sont proposées. Explore-les avec le doigt, certaines sont nommées, d'autres pas. Tape avec 3 doigts l'écran, un menu apparaît avec la première commande : Décrire l'image. Double-tape et TalkBack va te décrire l'image. Le défi est de retrouver l'image qui va t'être proposée.",
      build: buildImageFindLevel
    }
  ];

  /* =========================================================
     ECRANS
     ========================================================= */
  var welcomed = false;

  function renderHome(){
    stopAll();
    var app = document.getElementById('app');

    var scorableLevels = LEVELS.filter(function(l){ return !l.scoreless; });
    var totalScore = scorableLevels.reduce(function(sum, l){ return sum + (progress.scores[l.id] || 0); }, 0);

    var levelItems = LEVELS.map(function(l, i){
      return '<li><button class="level-item" data-index="' + i + '">' +
        (i + 1) + '. ' + l.title +
      '</button></li>';
    }).join('');

    app.innerHTML =
      '<div class="screen home-screen">' +
        '<p class="home-sub">Active TalkBack, pose ton doigt sur l\'écran et laisse-toi guider par la voix pour choisir le jeu. Lorsque tu entends le nom du jeu, double-tape avec ton doigt pour le lancer. Chaque jeu, sauf le premier, te rapporte ou te fait perdre des points.</p>' +
        '<h2 class="menu-heading">Les jeux</h2>' +
        '<ol class="level-list">' + levelItems + '</ol>' +
        '<div class="bottom-bar bottom-bar-home">' +
          '<p class="level-score">' + totalScore + (totalScore === 1 ? ' point' : ' points') + '</p>' +
        '</div>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll('button.level-item'), function(btn){
      btn.addEventListener('click', function(){ renderLevel(Number(btn.dataset.index)); });
    });

    if(!welcomed){
      welcomed = true;
      speak("Bienvenue sur cette application qui doit te permettre, avec quelques petits jeux, de t'initier à TalkBack.");
    }
  }

  function renderLevel(index){
    stopAll();
    var level = LEVELS[index];
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="screen level-screen">' +
        '<div class="cards-zone" id="cards-zone"></div>' +
        '<div class="bottom-bar">' +
          '<button class="btn-quiet" id="btn-menu">Retour au menu</button>' +
          '<p class="level-score" id="level-score"></p>' +
        '</div>' +
      '</div>';

    var cleanupFn = null;
    function registerCleanup(fn){ cleanupFn = fn; }
    function doCleanup(){ if(cleanupFn){ cleanupFn(); cleanupFn = null; } }

    document.getElementById('btn-menu').addEventListener('click', function(){ doCleanup(); renderHome(); });
    var cardsZone = document.getElementById('cards-zone');
    var scoreEl = document.getElementById('level-score');

    // Le score affiché est toujours le CUMUL total (les autres jeux déjà
    // joués + le score en cours de ce jeu-ci), pour rester cohérent avec
    // le score cumulé de l'accueil, visible en permanence en bas à droite.
    var scorableLevels = LEVELS.filter(function(l){ return !l.scoreless; });
    var baseTotal = scorableLevels
      .filter(function(l){ return l.id !== level.id; })
      .reduce(function(sum, l){ return sum + (progress.scores[l.id] || 0); }, 0);

    function setStageText(){ /* plus d'affichage visuel : tout passe par la voix */ }
    function setScore(n){
      var shown = baseTotal + (level.scoreless ? 0 : n);
      scoreEl.textContent = shown + (shown === 1 ? ' point' : ' points');
    }
    setScore(0);

    function complete(finalMessage, score){
      doCleanup();
      if(typeof score !== 'number') score = 6;
      recordScore(level.id, score);
      chimeBigSuccess();
      // Réussite : on verbalise le message, puis on revient directement
      // au menu pour choisir un autre jeu, sans écran intermédiaire à valider.
      announce(finalMessage, function(){ renderHome(); });
    }

    function fail(finalMessage, score){
      doCleanup();
      if(typeof score !== 'number') score = 0;
      recordScore(level.id, score);
      announce(finalMessage, function(){ renderLevelResult(index, score); });
    }

    // Pour le jeu d'initiation (sans points) : pas de score enregistré,
    // juste un aller-retour direct vers le menu, réussite ou non.
    function finishIntro(finalMessage, markDone){
      doCleanup();
      if(markDone && progress.completed.indexOf(level.id) === -1){
        progress.completed.push(level.id);
        saveProgress(progress);
      }
      if(markDone) chimeBigSuccess();
      announce(finalMessage, function(){ renderHome(); });
    }

    speak(level.intro, function(){
      level.build(cardsZone, { setStageText: setStageText, setScore: setScore, complete: complete, fail: fail, finishIntro: finishIntro, registerCleanup: registerCleanup });
    });
  }

  function renderLevelResult(index, score){
    var level = LEVELS[index];
    var success = score === 6;
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="screen complete-screen">' +
        '<p class="complete-emoji" aria-hidden="true">' + (success ? '🎉' : '🌱') + '</p>' +
        '<h2>' + (success ? 'Bravo, tu as réussi !' : 'Ce sera pour une prochaine fois') + '</h2>' +
        '<p class="complete-sub">Score : ' + score + (score > 1 ? ' points' : ' point') + '</p>' +
        (success
          ? '<button class="btn-primary" id="btn-menu2">Retour au menu</button>'
          : '<button class="btn-primary" id="btn-retry">Réessayer</button><button class="btn-quiet" id="btn-menu2">Retour au menu</button>')  +
      '</div>';
    if(!success){
      document.getElementById('btn-retry').addEventListener('click', function(){ renderLevel(index); });
    }
    document.getElementById('btn-menu2').addEventListener('click', renderHome);
    var toFocus = document.getElementById('btn-retry') || document.getElementById('btn-menu2');
    toFocus.focus();
  }

  /* =========================================================
     INITIALISATION
     ========================================================= */
  document.addEventListener('DOMContentLoaded', renderHome);

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
